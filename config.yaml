# Network
dgb_port: 12024
dgb_magic: "fac3b6da"

# Crawler
crawl_interval: 1800
crawl_concurrency: 10
crawl_timeout: 5
crawl_max_peers: 500
prune_hours: 24

# DNS Seeds — mirror of DigiByte Core chainparams.cpp mainnet vSeeds.
# Keep in sync with the node's compiled seed list (src/kernel/chainparams.cpp).
dns_seeds:
  - seed.digibyte.io           # Jared Tate @JaredTate
  - seed.diginode.tools        # Olly Stedall @saltedlolly
  - seed.digibyteblockchain.org  # John Song @j50ng
  - eu.digibyteseed.com        # Jan De Jong @jongjan88
  - seed.digibyte.link         # Bastian Driessen @bastiandriessen
  - seed.quakeguy.com          # Paul Morgan @SnKQuaKe
  - seed.aroundtheblock.app    # Mark McNiel @JohnnyLawDGB
  - seed.digibyte.services     # Craig Donnachie @cdonnachie

# Manually-known peers loaded into the crawl queue on every startup.
# Use this for known-good nodes (especially on non-default ports) that
# might not be reachable via DNS-seed gossip alone.
static_peers:
  - { ip: "64.182.71.55",     port: 12024, source: "filter-pin" }
  - { ip: "64.182.71.56",     port: 12024, source: "filter-pin" }
  - { ip: "70.253.65.85",     port: 12024, source: "filter-pin" }
  - { ip: "134.199.198.90",   port: 12024, source: "filter-pin" }
  - { ip: "129.212.182.152", port: 12024, source: "filter-vps" }
  - { ip: "174.131.163.123", port: 12024, source: "filter-vps" }
  # CGNAT'd home nodes reach the relay via reverse SSH tunnels (dgb-tunnel.sh),
  # so they appear under the relay's IP + the tunnel's remote port — NOT their
  # own CGNAT address. Do not add a raw public-IP entry for these (e.g. the old
  # 149.76.66.207:22024 johnnylaw entry never resolved — 149.76.66.207 is the
  # home CGNAT egress IP with no port-forward).
  - { ip: "134.199.198.90",   port: 13024, source: "polloloco-tunnel" }   # polloloco :12024 via digiscope.me relay
  - { ip: "129.212.182.152", port: 13025, source: "johnnylaw-tunnel" }   # johnnylaw :22024 via adam's VPS relay

# API
api_port: 8025
api_host: "0.0.0.0"
api_max_results: 25
api_max_age_hours: 6

# Ranking
ranking_window_days: 7
ranking_prior_attempts: 10
ranking_prior_successes: 5
ranking_longevity_cap_days: 60
ranking_longevity_weight: 0.30
ranking_inclusion_threshold: 0.50

# Database
db_path: "bloom_seeder.db"

# Logging
log_level: "INFO"
